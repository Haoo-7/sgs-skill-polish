<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">sgs-skill-polish 工作流</title>
  <desc id="d">工作流图：输入纯文本、卡面图或拓展包 JSON，判定任务类型为 A 起草、B 改写或 C 审查；所有流程共用六要素拆解（时机、条件、发动角色、目标、消耗、效果）；分别输出规范描述加六要素表、原句到新句的对照表、分级审查报告。</desc>

  <rect width="1200" height="340" rx="26" fill="#17150F"/>

  <!-- 页眉 -->
  <rect x="60" y="42" width="5" height="40" rx="2.5" fill="#B03A2E"/>
  <text x="78" y="70" font-family="Georgia,'Songti SC','SimSun',serif" font-size="30" fill="#F2ECDC"><tspan fill="#C9A45C">〖 </tspan>工作流<tspan fill="#C9A45C"> 〗</tspan></text>

  <!-- 输入行 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <text x="64" y="122" font-family="ui-monospace,'SF Mono',Consolas,Menlo,monospace" font-size="18" fill="#9C947F">输入</text>
    <g font-size="20" fill="#F2ECDC">
      <rect x="110" y="100" width="84" height="34" rx="8" fill="#221E15" stroke="#3A3226"/>
      <text x="152" y="123" text-anchor="middle">纯文本</text>
      <rect x="202" y="100" width="84" height="34" rx="8" fill="#221E15" stroke="#3A3226"/>
      <text x="244" y="123" text-anchor="middle">卡面图</text>
      <rect x="294" y="100" width="136" height="34" rx="8" fill="#221E15" stroke="#3A3226"/>
      <text x="362" y="123" text-anchor="middle">拓展包 JSON</text>
    </g>
    <line x1="438" y1="117" x2="548" y2="117" stroke="#9C947F" stroke-width="1.5"/>
    <polygon points="548,111 558,117 548,123" fill="#9C947F"/>
    <rect x="560" y="100" width="170" height="34" rx="8" fill="#2A2418" stroke="#C9A45C" stroke-width="1.5"/>
    <text x="645" y="123" text-anchor="middle" font-size="20" fill="#F2ECDC">判定任务类型</text>
    <line x1="738" y1="117" x2="752" y2="117" stroke="#9C947F" stroke-width="1.5"/>
    <polygon points="752,111 762,117 752,123" fill="#9C947F"/>
    <g font-size="20">
      <rect x="766" y="100" width="118" height="34" rx="8" fill="#1E1A12" stroke="#3A3226"/>
      <text x="825" y="123" text-anchor="middle"><tspan font-weight="700" fill="#C4453A">A</tspan><tspan fill="#F2ECDC"> 起草</tspan></text>
      <rect x="892" y="100" width="118" height="34" rx="8" fill="#1E1A12" stroke="#3A3226"/>
      <text x="951" y="123" text-anchor="middle"><tspan font-weight="700" fill="#C4453A">B</tspan><tspan fill="#F2ECDC"> 改写</tspan></text>
      <rect x="1018" y="100" width="118" height="34" rx="8" fill="#1E1A12" stroke="#3A3226"/>
      <text x="1077" y="123" text-anchor="middle"><tspan font-weight="700" fill="#C4453A">C</tspan><tspan fill="#F2ECDC"> 审查</tspan></text>
    </g>
  </g>

  <!-- 六要素拆解带 -->
  <line x1="64" y1="166" x2="1136" y2="166" stroke="#C9A45C" stroke-width="1" opacity="0.6"/>
  <rect x="440" y="148" width="320" height="36" rx="18" fill="#17150F" stroke="#C9A45C" stroke-width="1.5"/>
  <text x="600" y="172" text-anchor="middle" font-size="20" fill="#F2ECDC" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">六要素拆解 · 缺哪项补哪项</text>
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#F2ECDC" text-anchor="middle">
    <rect x="65"  y="198" width="170" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="150" y="222">时机</text>
    <rect x="245" y="198" width="170" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="330" y="222">条件</text>
    <rect x="425" y="198" width="200" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="525" y="222">发动角色</text>
    <rect x="635" y="198" width="160" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="715" y="222">目标</text>
    <rect x="805" y="198" width="160" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="885" y="222">消耗</text>
    <rect x="975" y="198" width="160" height="34" rx="8" fill="#221E15" stroke="#3A3226"/><text x="1055" y="222">效果</text>
  </g>

  <!-- 连接线 -->
  <g stroke="#3A3226" stroke-width="1.5">
    <line x1="229" y1="232" x2="229" y2="256"/>
    <line x1="597" y1="232" x2="597" y2="256"/>
    <line x1="968" y1="232" x2="968" y2="256"/>
  </g>

  <!-- 三种输出 -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20">
    <rect x="64" y="256" width="331" height="56" rx="10" fill="#1E1A12" stroke="#3A3226"/>
    <text x="84" y="291"><tspan font-weight="700" fill="#C4453A">A</tspan><tspan fill="#F2ECDC"> ▸ 规范描述 + 六要素表</tspan></text>

    <rect x="430" y="256" width="335" height="56" rx="10" fill="#1E1A12" stroke="#3A3226"/>
    <text x="450" y="291"><tspan font-weight="700" fill="#C4453A">B</tspan><tspan fill="#F2ECDC"> ▸ 原句 → 新句对照表</tspan></text>

    <rect x="800" y="256" width="336" height="56" rx="10" fill="#1E1A12" stroke="#3A3226"/>
    <text x="820" y="291"><tspan font-weight="700" fill="#C4453A">C</tspan><tspan fill="#F2ECDC"> ▸ 分级审查报告</tspan></text>
  </g>
</svg>
